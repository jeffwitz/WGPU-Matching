<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
<title id="title">Portable image matching and window initialization</title>
<desc id="desc">Native and learned matchers produce observed point pairs. Geometric verification can feed an affine or Gaussian radial-basis field. The field provides six parameters at requested centres before an external image-based refinement.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#638093"/></marker></defs>
<style>
.box{fill:#f1f6f9;stroke:#53768e;stroke-width:1.8;rx:12}
.blue{fill:#eaf4f8;stroke:#227893}.green{fill:#edf6f0;stroke:#438269}.gold{fill:#fff8e8;stroke:#b39247}
.title{font:600 20px sans-serif;fill:#19364a}.text{font:16px sans-serif;fill:#395367}.note{font:15px sans-serif;fill:#4d6677}
.arrow{fill:none;stroke:#638093;stroke-width:2;marker-end:url(#arrow)}
</style>
<rect class="box" x="20" y="135" width="165" height="115"/>
<text class="title" x="102" y="171" text-anchor="middle">Image pair</text>
<text class="text" x="102" y="200" text-anchor="middle">reference + target</text>
<text class="text" x="102" y="224" text-anchor="middle">original pixel frame</text>
<path class="arrow" d="M185 192 H205 V93 H237"/>
<path class="arrow" d="M205 192 V281 H237"/>
<rect class="box blue" x="240" y="35" width="285" height="115"/>
<text class="title" x="382" y="70" text-anchor="middle">Direct image matchers</text>
<text class="text" x="382" y="99" text-anchor="middle">hierarchy / patch search</text>
<text class="text" x="382" y="125" text-anchor="middle">learned semi-dense matches</text>
<rect class="box green" x="240" y="225" width="285" height="115"/>
<text class="title" x="382" y="260" text-anchor="middle">Feature pipelines</text>
<text class="text" x="382" y="289" text-anchor="middle">points → descriptors → pairs</text>
<text class="text" x="382" y="315" text-anchor="middle">native and learned detectors</text>
<path class="arrow" d="M525 93 H548 V192 H577"/>
<path class="arrow" d="M525 281 H548 V192"/>
<rect class="box" x="580" y="135" width="220" height="115"/>
<text class="title" x="690" y="170" text-anchor="middle">Observed pairs</text>
<text class="text" x="690" y="199" text-anchor="middle">geometric verification</text>
<text class="text" x="690" y="224" text-anchor="middle">keep rejected data too</text>
<path class="arrow" d="M800 192 H842"/>
<rect class="box gold" x="845" y="135" width="240" height="115"/>
<text class="title" x="965" y="170" text-anchor="middle">Optional field projection</text>
<text class="text" x="965" y="199" text-anchor="middle">affine / Gaussian radial basis</text>
<text class="text" x="965" y="224" text-anchor="middle">robust fit; explicit selection</text>
<path class="arrow" d="M1085 192 H1127"/>
<rect class="box blue" x="1130" y="135" width="250" height="115"/>
<text class="title" x="1255" y="170" text-anchor="middle">Window initializers</text>
<text class="text" x="1255" y="199" text-anchor="middle">translation + four gradients</text>
<text class="text" x="1255" y="224" text-anchor="middle">exact requested centres</text>
<path class="arrow" d="M1255 250 V292"/>
<rect class="box" x="1130" y="295" width="250" height="85"/>
<text class="title" x="1255" y="329" text-anchor="middle">Image-based refinement</text>
<text class="text" x="1255" y="356" text-anchor="middle">external solver; not included</text>
<text class="note" x="22" y="390">A fitted field is an inferred initializer, not a new set of independently measured matches.</text>
</svg>
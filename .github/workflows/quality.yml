name: Python and documentation quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and checks
        run: python -m pip install -e ".[test]"
      - name: Lint
        run: ruff check python/src python/benchmarks python/examples python/tests docs/_ext
      - name: Unit tests
        run: pytest -q

  docs-and-wheel:
    name: Sphinx build and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and documentation tools
        run: python -m pip install -e ".[dev,docs,test]"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Build strict HTML documentation
        run: sphinx-build -b html -W --keep-going docs docs/_build/html
      - name: Check wheel metadata and WGSL resources
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -c "import importlib.resources as r, wgpu_matching; assert r.files('wgpu_matching').joinpath('shaders/horg-ransac.wgsl').is_file(); print(wgpu_matching.__version__)"
      - name: Unit tests
        run: pytest -q

  cpm-webgpu-smoke:
    name: Browser WebGPU smoke and Python parity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: browser-actions/setup-chrome@v1
      - name: Install Python WebGPU package
        run: python -m pip install .
      - name: Install software Vulkan runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Compare Python and browser DeepMatching/HORG outputs
        env:
          WGPU_MATCHING_PARITY_DEVICE_TYPE: cpu
        run: node tests/run_matcher_parity.mjs
      - name: Run deterministic CPM translation test
        run: node tests/run_cpm_browser_smoke.mjs

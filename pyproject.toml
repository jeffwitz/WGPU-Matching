[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wgpu-matching"
version = "0.1.0"
description = "Native WebGPU feature matchers for DIC initialization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.0",
  "wgpu>=0.32,<0.33",
]

[project.optional-dependencies]
dev = ["build>=1.2"]
docs = ["Sphinx>=8.2,<9", "sphinx-rtd-theme>=2,<4", "myst-parser>=5,<6"]
test = ["pytest>=8,<9", "ruff>=0.8"]

[tool.setuptools]
package-dir = {"" = "python/src"}

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.setuptools.package-data]
wgpu_matching = ["py.typed", "shaders/*.wgsl"]

[tool.ruff]
line-length = 100
target-version = "py311"
